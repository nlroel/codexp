# Codexp release workflow — adapted from openai/codex rust-release.yml
# Builds multi-platform binaries and publishes to GitHub Releases.
# Triggered by pushing a tag matching codexp-v*.*.*

name: codexp-release

on:
  push:
    tags:
      - "codexp-v*.*.*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM64 (native)
          - runs_on: macos-14
            target: aarch64-apple-darwin
            binaries: "codexp codexp-code-mode-host codexp-exec"
          # macOS x86_64 (cross-compile from ARM)
          - runs_on: macos-14
            target: x86_64-apple-darwin
            binaries: "codexp codexp-code-mode-host codexp-exec"
          # Linux x86_64 (musl, static)
          - runs_on: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            binaries: "codexp codexp-code-mode-host codexp-exec"
          # Linux ARM64 (musl, static, native ARM runner)
          - runs_on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binaries: "codexp codexp-code-mode-host codexp-exec"
          # Windows x86_64 (native)
          - runs_on: windows-2022
            target: x86_64-pc-windows-msvc
            binaries: "codexp codexp-code-mode-host codexp-exec"

    defaults:
      run:
        working-directory: codex-rs

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils pkg-config libcap-dev musl-tools clang lld

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig (Linux musl cross-compiler)
        if: ${{ runner.os == 'Linux' }}
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0

      - name: Configure musl linker (Linux)
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          target="${{ matrix.target }}"
          arch="${target%%-*}"
          zig_target="${target/-unknown-linux-musl/-linux-musl}"
          # Use Zig as the cross-compilation linker for musl
          mkdir -p "${RUNNER_TEMP}/musl-linker"
          cat > "${RUNNER_TEMP}/musl-linker/${arch}-linux-musl-cc" << SCRIPT
          #!/bin/sh
          exec zig cc -target ${zig_target} "$@"
          SCRIPT
          chmod +x "${RUNNER_TEMP}/musl-linker/${arch}-linux-musl-cc"
          echo "CARGO_TARGET_${target^^//-/_}_LINKER=${RUNNER_TEMP}/musl-linker/${arch}-linux-musl-cc" >> "$GITHUB_ENV"

      - name: Disable aws-lc jitter entropy (Linux)
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          target="${{ matrix.target }}"
          env_var="AWS_LC_SYS_NO_JITTER_ENTROPY_${target}"
          env_var="${env_var//-/_}"
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          echo "${env_var}=1" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          target="${{ matrix.target }}"
          build_args=()
          for binary in ${{ matrix.binaries }}; do
            build_args+=(--bin "$binary")
          done
          cargo build --target "$target" --release "${build_args[@]}"

      - name: Package (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          target="${{ matrix.target }}"
          mkdir -p dist/codexp/bin
          for binary in ${{ matrix.binaries }}; do
            cp "target/${target}/release/${binary}" dist/codexp/bin/
          done
          tar -czf "codexp-package-${target}.tar.gz" -C dist codexp
          sha256sum "codexp-package-${target}.tar.gz" >> codexp-package_SHA256SUMS

      - name: Package (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $target = "${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path dist/codexp/bin
          $binaries = "${{ matrix.binaries }}" -split ' '
          foreach ($bin in $binaries) {
            Copy-Item "codex-rs/target/$target/release/$bin.exe" "dist/codexp/bin/"
          }
          tar -czf "codexp-package-$target.tar.gz" -C dist codexp
          $hash = (Get-FileHash "codexp-package-$target.tar.gz" -Algorithm SHA256).Hash.ToLower()
          "$hash  codexp-package-$target.tar.gz" | Out-File -Append -Encoding ascii codexp-package_SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: codexp-${{ matrix.target }}
          path: |
            codex-rs/codexp-package-*.tar.gz
            codex-rs/codexp-package_SHA256SUMS

  release:
    needs: [build]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/codexp-v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/codexp-package-*.tar.gz
            dist/codexp-package_SHA256SUMS
          generate_release_notes: true
