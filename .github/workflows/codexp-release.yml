# Codexp release workflow — adapted from openai/codex rust-release.yml
# Builds multi-platform binaries and publishes to GitHub Releases.
# Triggered by pushing a tag matching codexp-v*.*.*

name: codexp-release

on:
  push:
    tags:
      - "codexp-v*.*.*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM64 (native)
          - runs_on: macos-14
            target: aarch64-apple-darwin
            binaries: "codexp codexp-code-mode-host codexp-exec"
          # macOS x86_64 (cross-compile from ARM)
          - runs_on: macos-14
            target: x86_64-apple-darwin
            binaries: "codexp codexp-code-mode-host codexp-exec"
          # Linux x86_64 (musl, static)
          - runs_on: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            binaries: "codexp codexp-code-mode-host codexp-exec"
          # Linux ARM64 (musl, static, native ARM runner)
          - runs_on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            binaries: "codexp codexp-code-mode-host codexp-exec"
          # Windows x86_64 (native)
          - runs_on: windows-2022
            target: x86_64-pc-windows-msvc
            binaries: "codexp codexp-code-mode-host codexp-exec"

    defaults:
      run:
        working-directory: codex-rs

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils pkg-config libcap-dev musl-tools clang lld

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Ensure rust target is installed
        shell: bash
        run: rustup target add ${{ matrix.target }}

      - name: Install Zig (Linux musl)
        if: ${{ runner.os == 'Linux' }}
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.0
          use-cache: false

      - name: Install musl build tools
        if: ${{ runner.os == 'Linux' }}
        env:
          TARGET: ${{ matrix.target }}
        run: bash "${GITHUB_WORKSPACE}/.github/scripts/install-musl-build-tools.sh"

      - name: Configure rusty_v8 artifact overrides
        uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Disable aws-lc jitter entropy (Linux)
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          target="${{ matrix.target }}"
          env_var="AWS_LC_SYS_NO_JITTER_ENTROPY_${target}"
          env_var="${env_var//-/_}"
          echo "AWS_LC_SYS_NO_JITTER_ENTROPY=1" >> "$GITHUB_ENV"
          echo "${env_var}=1" >> "$GITHUB_ENV"

      - name: Build
        shell: bash
        run: |
          target="${{ matrix.target }}"
          build_args=()
          for binary in ${{ matrix.binaries }}; do
            build_args+=(--bin "$binary")
          done
          cargo build --target "$target" --release "${build_args[@]}"

      - name: Package (Unix)
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        run: |
          target="${{ matrix.target }}"
          mkdir -p dist/codexp/bin
          for binary in ${{ matrix.binaries }}; do
            cp "target/${target}/release/${binary}" dist/codexp/bin/
          done
          tar -czf "codexp-package-${target}.tar.gz" -C dist codexp

      - name: Package (Windows)
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $target = "${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path dist/codexp/bin
          $binaries = "${{ matrix.binaries }}" -split ' '
          foreach ($bin in $binaries) {
            Copy-Item "codex-rs/target/$target/release/$bin.exe" "dist/codexp/bin/"
          }
          tar -czf "codexp-package-$target.tar.gz" -C dist codexp

      - uses: actions/upload-artifact@v4
        with:
          name: codexp-${{ matrix.target }}
          path: codex-rs/codexp-package-*.tar.gz

  release:
    needs: [build]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/codexp-v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Add Codexp package checksum manifest
        run: |
          set -euo pipefail

          manifest="dist/codexp-package_SHA256SUMS"
          tmp_manifest="$(mktemp)"
          find dist -type f -name 'codexp-package-*.tar.gz' -print |
            sort |
            while IFS= read -r archive; do
              sha256sum "$archive" |
                awk -v name="$(basename "$archive")" '{ print $1 "  " name }'
            done > "$tmp_manifest"

          if [[ ! -s "$tmp_manifest" ]]; then
            echo "No Codexp package archives found for checksum manifest"
            exit 1
          fi

          mv "$tmp_manifest" "$manifest"
          cat "$manifest"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/codexp-package-*.tar.gz
            dist/codexp-package_SHA256SUMS
          generate_release_notes: true
